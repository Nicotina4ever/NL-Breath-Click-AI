name: Portable engine and SDK
on:
  push:
    branches: [main, public/portability-ci]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libmp3lame-dev
      - name: macOS development libraries
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install lame openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Python test dependencies (not application dependencies)
        run: python -m pip install -r tests/requirements.txt
      - name: Configure headless Core, CLI and independent SDK
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBC_BUILD_EDITOR=OFF -DBC_BUILD_STUDIO=OFF -DBC_BUILD_STUDIO_CLI=ON
          -DBC_BUILD_TESTS=ON -DBC_BUILD_REAPER_TESTS=ON
          -DBC_SOURCE_COMMIT=${{ github.sha }}
          -DBC_PYTHON_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"
      - name: Compile
        run: cmake --build build --config Release --parallel 4
      - name: All registered headless tests (no GUI or DAW runtime implied)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install engine SDK
        run: cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/sdk"
      - name: Build a consumer with no source-tree includes
        run: |
          cmake -S tests/sdk_consumer -B sdk-consumer -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/sdk" -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"
          cmake --build sdk-consumer --config Release --parallel 4
      - name: Run independent SDK consumer
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            ./sdk-consumer/Release/nl_suite_engine.exe
          else
            ./sdk-consumer/nl_suite_engine
          fi
